name: Terraform Deployment (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Environment name (prod or preview)
        required: true
        type: string
      terraform-version:
        description: Terraform version to use
        required: false
        type: string
        default: "1.9"
      working-directory:
        description: Terraform working directory
        required: false
        type: string
        default: infra/terraform/environments/prod
      run-plan:
        description: Run terraform plan
        required: false
        type: boolean
        default: true
      run-apply:
        description: Run terraform apply
        required: false
        type: boolean
        default: true
      require-changes:
        description: Only apply if changes detected
        required: false
        type: boolean
        default: true
      post-to-pr:
        description: Post plan to PR (preview only)
        required: false
        type: boolean
        default: false
    secrets:
      AUTH0_DOMAIN:
        required: true
      AUTH0_CLIENT_ID:
        required: true
      AUTH0_CLIENT_SECRET:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SQL_ADMIN_PASSWORD:
        required: true
      OPENAI_API_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      WEBSHARE_PROXY_USERNAME:
        required: false
      WEBSHARE_PROXY_PASSWORD:
        required: false
      AZURE_OPENAI_API_KEY:
        required: false
      AZURE_OPENAI_ENDPOINT:
        required: false
      AZURE_OPENAI_DEPLOYMENT:
        required: false
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT:
        required: false
    outputs:
      plan-summary:
        description: Terraform plan summary
        value: ${{ jobs.terraform-plan.outputs.plan_summary }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: inputs.run-plan
    outputs:
      plan_summary: ${{ steps.plan.outputs.plan_summary }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      # See docs/workflows/auth0-credentials.md for credential details
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_webshare_proxy_username: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
      TF_VAR_webshare_proxy_password: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
      TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      TF_VAR_azure_openai_endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      TF_VAR_azure_openai_deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      TF_VAR_azure_openai_embedding_deployment: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Azure credentials
        uses: AshleyHollis/shared-infra/.github/actions/verify-azure-credentials@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Terraform configuration
        uses: AshleyHollis/shared-infra/.github/actions/validate@v1
        with:
          validators: terraform-config
          terraform-directory: ${{ inputs.working-directory }}
          fail-fast: "true"
          timeout-seconds: "60"

      - name: Terraform Plan
        id: plan
        uses: AshleyHollis/shared-infra/.github/actions/terraform-plan@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          sql-admin-password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: ${{ inputs.post-to-pr == true }}

      - name: Prepare plan data for PR comment
        if: inputs.post-to-pr && github.event_name == 'pull_request'
        env:
          PLAN_SUMMARY: ${{ steps.plan.outputs.plan_summary }}
          PLAN_JSON_PATH: ${{ steps.plan.outputs.plan_json_path }}
        run: |
          PLAN_DATA_DIR="$(mktemp -d)"

          # Write plan summary JSON
          echo "$PLAN_SUMMARY" > "$PLAN_DATA_DIR/plan-summary.json"

          # Copy full plan JSON as formatted-plan.json (used by action-main.js for change details)
          if [ -f "$PLAN_JSON_PATH" ]; then
            cp "$PLAN_JSON_PATH" "$PLAN_DATA_DIR/formatted-plan.json"
            echo "✅ Copied plan.json ($(wc -c < "$PLAN_DATA_DIR/formatted-plan.json") bytes)"
          else
            echo "{}" > "$PLAN_DATA_DIR/formatted-plan.json"
            echo "⚠️ plan.json not found at: $PLAN_JSON_PATH"
          fi

          echo "TERRAFORM_PLAN_DATA_DIR=$PLAN_DATA_DIR" >> $GITHUB_ENV
          echo "✅ Plan data prepared at: $PLAN_DATA_DIR"
          ls -lh "$PLAN_DATA_DIR"

      - name: Post Plan to PR and Summary
        if: inputs.post-to-pr && github.event_name == 'pull_request'
        uses: AshleyHollis/shared-infra/.github/actions/post-terraform-plan@v1
        with:
          plan-summary: ${{ steps.plan.outputs.plan_summary }}
          plan-json-path: ${{ steps.plan.outputs.plan_json_path }}
          plan-outcome: ${{ steps.plan.outcome }}

      - name: Plan Status Check
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/plan_output.txt
            ${{ inputs.working-directory }}/plan.json
          retention-days: 7

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      inputs.run-apply &&
      needs.terraform-plan.result == 'success' &&
      (!inputs.require-changes || fromJson(needs.terraform-plan.outputs.plan_summary).has_changes == true)
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      # See docs/workflows/auth0-credentials.md for credential details
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_VAR_webshare_proxy_username: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
      TF_VAR_webshare_proxy_password: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
      TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
      TF_VAR_azure_openai_endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      TF_VAR_azure_openai_deployment: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      TF_VAR_azure_openai_embedding_deployment: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Azure credentials
        uses: AshleyHollis/shared-infra/.github/actions/verify-azure-credentials@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}

      - name: Validate Terraform configuration
        uses: AshleyHollis/shared-infra/.github/actions/validate@v1
        with:
          validators: terraform-config
          terraform-directory: ${{ inputs.working-directory }}
          fail-fast: "true"
          timeout-seconds: "60"

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
