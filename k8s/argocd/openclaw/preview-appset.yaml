apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yt-summarizer-previews
  namespace: argocd
  labels:
    app.kubernetes.io/name: yt-summarizer
    app.kubernetes.io/component: preview
    app.kubernetes.io/part-of: yt-summarizer
    app.kubernetes.io/platform: openclaw
spec:
  generators:
    - git:
        repoURL: https://github.com/AshleyHollis/yt-summarizer.git
        revision: preview-overlays
        directories:
          - path: k8s/overlays/preview-pr-*
            exclude: false
        requeueAfterSeconds: 15
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
      labels:
        app.kubernetes.io/name: yt-summarizer
        app.kubernetes.io/instance: '{{path.basename}}'
        app.kubernetes.io/component: preview
        app.kubernetes.io/part-of: yt-summarizer
        app.kubernetes.io/platform: openclaw
      annotations:
        preview.yt-summarizer/overlay-path: '{{path}}'
        preview.yt-summarizer/overlay-revision: '{{revision}}'
        argocd.argoproj.io/refresh: hard
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/AshleyHollis/yt-summarizer.git
        targetRevision: preview-overlays
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 3
      ignoreDifferences:
        - group: batch
          kind: Job
          jqPathExpressions:
            - .status.completionTime
            - .status.conditions
            - .status.startTime
            - .status.succeeded
            - .status.active
            - .status.failed
  syncPolicy:
    preserveResourcesOnDeletion: false
