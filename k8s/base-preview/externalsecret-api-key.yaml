# =============================================================================
# ExternalSecret for API Key (programmatic access)
# =============================================================================
# Syncs API key from Azure Key Vault to K8s Secret for preview automation.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-key-credentials
  labels:
    app.kubernetes.io/name: yt-summarizer
    app.kubernetes.io/part-of: yt-summarizer
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault-cluster
  target:
    name: api-key-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: api-key
