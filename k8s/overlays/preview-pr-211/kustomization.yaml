      kind: ExternalSecret
    patch: |-
      - op: replace
        path: /apiVersion
        value: external-secrets.io/v1

  - target:
      version: v1
      kind: ServiceAccount
      name: yt-summarizer-sa
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: acr-pull-secret

  # ConfigMap patch - CORS origins with SWA URL
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: yt-summarizer-config
      data:
        CORS_ORIGINS: "https://proud-hill-0940e7300-211.eastasia.6.azurestaticapps.net"
    target:
      kind: ConfigMap
      name: yt-summarizer-config

  # API Deployment patch - CORS origins env var
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
            - name: api
              env:
              - name: API__CORS_ORIGINS
                value: '["https://proud-hill-0940e7300-211.eastasia.6.azurestaticapps.net","http://localhost:3000"]'
              - name: AUTH0_DEFAULT_RETURN_TO
                value: "https://proud-hill-0940e7300-211.eastasia.6.azurestaticapps.net"
    target:
      kind: Deployment
      name: api

  # HTTPRoute patch - Cloudflare Tunnel terminates TLS and forwards HTTP internally
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: api-httproute
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: http-yt-summarizer-preview
      - op: replace
        path: /spec/hostnames/0
        value: "api-pr-211.ashleyhollis.com"
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname

  # Replicas patch - single replica for all deployments
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component

