# =============================================================================
# OpenClaw Preview Overlay Kustomization Template
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  annotations:
    config.kubernetes.io/local-config: 'true'

namespace: preview-pr-${PR_NUMBER}

resources:
  - ../../base-preview
  - resource-quota.yaml
  - limit-range.yaml

images:
  - name: yt-summarizer-api
    newName: ${ACR_SERVER}/yt-summarizer-api
    newTag: ${IMAGE_TAG}
  - name: yt-summarizer-workers
    newName: ${ACR_SERVER}/yt-summarizer-workers
    newTag: ${IMAGE_TAG}

patches:
  - target:
      group: external-secrets.io
      version: v1beta1
      kind: ExternalSecret
    patch: |-
      - op: replace
        path: /apiVersion
        value: external-secrets.io/v1

  - target:
      version: v1
      kind: ServiceAccount
      name: yt-summarizer-sa
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: acr-pull-secret

  # ConfigMap patch - CORS origins with SWA URL
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: yt-summarizer-config
      data:
        CORS_ORIGINS: "${SWA_URL}"
    target:
      kind: ConfigMap
      name: yt-summarizer-config

  # API Deployment patch - CORS origins env var
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
            - name: api
              env:
              - name: API__CORS_ORIGINS
                value: '["${SWA_URL}","http://localhost:3000"]'
              - name: AUTH0_DEFAULT_RETURN_TO
                value: "${SWA_URL}"
    target:
      kind: Deployment
      name: api

  # HTTPRoute patch - Cloudflare Tunnel terminates TLS and forwards HTTP internally
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: api-httproute
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: http-yt-summarizer-preview
      - op: replace
        path: /spec/hostnames/0
        value: "${PREVIEW_HOST}"
      - op: remove
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1hostname

  # Replicas patch - single replica for all deployments
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component

  # Resource limits patch - API deployment
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
    target:
      kind: Deployment
      name: api

  # Resource limits patch - Worker deployments
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 256Mi
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=worker

  # Migration job patch - resource limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 256Mi
    target:
      kind: Job
      name: db-migration

labels:
  - pairs:
      app.kubernetes.io/platform: openclaw

commonAnnotations:
  deployment.kubernetes.io/platform: openclaw
